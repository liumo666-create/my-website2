<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字视频技术 - 智能记忆刷题系统</title>
    <style>
        :root { --primary: #4834d4; --success: #6ab04c; --error: #eb4d4b; --bg: #f9ca24; --panel: #ffffff; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f1f2f6; margin: 0; padding: 20px; color: #2f3542; }
        .container { max-width: 900px; margin: 0 auto; background: var(--panel); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        h1 { text-align: center; color: #2f3542; margin-bottom: 10px; font-weight: 800; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #57606f; margin-bottom: 30px; font-size: 0.95rem; }

        /* 进度控制台 */
        .dashboard { background: #dfe4ea; border-radius: 10px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; border-left: 5px solid var(--primary); }
        .stat-label { font-size: 0.9rem; color: #747d8c; font-weight: bold; text-transform: uppercase; }
        .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--primary); }
        .progress-bar-bg { grid-column: 1 / -1; background: #ced6e0; height: 12px; border-radius: 6px; overflow: hidden; position: relative; }
        .progress-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.5s ease; }
        .progress-text { position: absolute; top: -20px; right: 0; font-size: 0.8rem; color: #2f3542; font-weight: bold; }

        /* 题目卡片 */
        .question-card { background: #fff; border: 1px solid #f1f2f6; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: transform 0.2s; }
        .question-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .q-meta { display: flex; align-items: center; margin-bottom: 12px; }
        .q-id { background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-right: 10px; }
        .q-topic { background: #a4b0be; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
        
        .q-body { font-size: 1.1rem; line-height: 1.8; }
        
        /* 输入框 */
        input.blank {
            border: none; border-bottom: 2px solid #a4b0be; 
            font-family: Consolas, monospace; font-size: 1.1rem; text-align: center;
            color: var(--primary); background: transparent; 
            min-width: 120px; padding: 0 5px; margin: 0 4px; outline: none; transition: 0.3s;
            font-weight: bold;
        }
        input.blank:focus { border-bottom-color: var(--primary); background: rgba(72, 52, 212, 0.05); }
        
        /* 状态样式 */
        input.correct { border-bottom-color: var(--success); color: var(--success); background: rgba(106, 176, 76, 0.1); }
        input.incorrect { border-bottom-color: var(--error); color: var(--error); background: rgba(235, 77, 75, 0.1); }
        
        .feedback { display: none; margin-top: 10px; padding: 10px; background: #ffeaa7; color: #d35400; border-radius: 5px; font-size: 0.9rem; font-weight: bold; }

        /* 按钮 */
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 40px; padding-top: 20px; border-top: 2px solid #f1f2f6; }
        button { border: none; padding: 12px 30px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.95); }
        .btn-sub { background: var(--primary); }
        .btn-next { background: var(--success); }
        .btn-reset { background: #747d8c; }

        /* 通关画面 */
        #victory-screen { display: none; text-align: center; padding: 50px 20px; }
        #victory-screen h2 { color: var(--success); font-size: 2rem; margin-bottom: 20px; }
        
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5rem; }
            .btn-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>数字视频技术 · 智能题库</h1>

            <div class="stat-label">本次题目</div>
            <div class="stat-value" id="current-count">0</div>
        </div>
        <div>
            <div class="stat-label">题库总进度 (已掌握)</div>

        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
            <span class="progress-text" id="progress-text">0%</span>
        </div>
    </div>

    <div id="quiz-area"></div>

    <div id="victory-screen">
        <h2>🎉 太棒了！题库已刷穿！</h2>
        <p>所有考点的所有变体你都已经掌握。</p>
        <button class="btn-reset" onclick="resetProgress()">重置进度，从头再来</button>
    </div>

    <div class="btn-group" id="controls">
        <button class="btn-sub" onclick="submitBatch()">提交答案</button>
        <button class="btn-next" onclick="loadBatch()">换一批 (刷新)</button>
        <button class="btn-reset" onclick="if(confirm('确定要清空记忆吗？')) resetProgress()">重置记忆</button>
    </div>
</div>

        { id: 36, topic: "下载播放", vars: [
            { q: "下载播放实际上是一种 {input} 的传播方式，实质是将媒体文件作为一般文件对待。", a: ["非实时传输", "非实时"] },
            { q: "将媒体文件作为一般文件对待的非实时传播方式称为 {input} 。", a: ["下载播放"] }
        ]},
        // 37. DPCM误差 (复用变体)
        { id: 37, topic: "DPCM误差2", vars: [
            { q: "DPCM 系统中输入输出信号之间的误差主要是由 {input} 引起的。", a: ["量化器", "量化误差"] }
        ]},
        // 38. 比特率 (复用变体)
        { id: 38, topic: "比特率2", vars: [
            { q: "数字信号的传输比特率等于采样频率与 {input} 的乘积。", a: ["量化比特数", "比特数"] }
        ]},
        // 39. 色调与波长
        { id: 39, topic: "色调波长", vars: [
            { q: "色调与光的 {input} 有关，改变光的波谱成分，会使光的色调发生变化。", a: ["波长"] },
            { q: "改变光的波谱成分，会使光的 {input} 发生变化。", a: ["色调"] }
        ]},
        // 40. 摄取与重现
        { id: 40, topic: "摄取重现", vars: [
            { q: "电视图像的摄取与重现实质上是一种 {input} 过程，分别由摄像管和显像管来完成。", a: ["光电转换"] },
            { q: "分别由摄像管和显像管完成的是电视图像的 {input} 和 {input} 过程。", a: ["摄取", "重现"] }
        ]}
    ];

    // 初始化题库：展开所有变体，赋予唯一UUID
    let questionPool = [];
    
    function initPool() {
        questionPool = [];
        let globalIndex = 0;
        rawData.forEach(item => {
            item.vars.forEach((v, vIndex) => {
                questionPool.push({
                    uuid: `q-${item.id}-${vIndex}`, // 唯一ID
                    topicId: item.id,
                    topic: item.topic,
                    q: v.q,
                    a: v.a
                });
            });
        });
        document.getElementById('total-count').innerText = questionPool.length;
    }

    // 状态管理
    let masteredIDs = [];
    let currentBatch = [];

    window.onload = function() {
        initPool();
        loadProgress();
        loadBatch(); // 初始加载
    };

    function loadProgress() {
        const saved = localStorage.getItem('video_quiz_mastered');
        if (saved) {
            masteredIDs = JSON.parse(saved);
        }
        updateUI();
    }

    function saveProgress() {
        localStorage.setItem('video_quiz_mastered', JSON.stringify(masteredIDs));
        updateUI();
    }

    function updateUI() {
        const count = masteredIDs.length;
        const total = questionPool.length;
        document.getElementById('mastered-count').innerText = count;
        
        const pct = Math.round((count / total) * 100) || 0;
        document.getElementById('progress-fill').style.width = pct + "%";
        document.getElementById('progress-text').innerText = pct + "%";

        if (count === total && total > 0) {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('victory-screen').style.display = 'block';
            document.getElementById('controls').style.display = 'none';
        } else {
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('victory-screen').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
        }
    }

    function resetProgress() {
        masteredIDs = [];
        saveProgress();
        loadBatch();
        alert("记忆已清空，一切重新开始！");
    }

    // 核心逻辑：获取一批题目
    function loadBatch() {
        // 1. 找出所有未掌握的题目
        const available = questionPool.filter(q => !masteredIDs.includes(q.uuid));
        
        if (available.length === 0 && questionPool.length > 0) {
            updateUI(); // 触发通关界面
            return;
        }

        // 2. 防撞车筛选：同一个 TopicId 只取 1 个
        // 先打乱 available 顺序，保证随机性
        shuffleArray(available);
        
        const selected = [];
        const seenTopics = new Set();
        
        for (let q of available) {
            if (!seenTopics.has(q.topicId)) {
                selected.push(q);
                seenTopics.add(q.topicId);
            }
        }

        // 3. 渲染
        currentBatch = selected;
        renderBatch();
    }

    function renderBatch() {
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';
        document.getElementById('current-count').innerText = currentBatch.length;

        currentBatch.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            // 题头
            let html = `<div class="q-meta">
                <span class="q-id">${index + 1}</span>
                <span class="q-topic">${item.topic}</span>
            </div>`;
            
            // 题干处理
            let parts = item.q.split('{input}');
            let body = `<div class="q-body">`;
            parts.forEach((part, i) => {
                body += part;
                if (i < parts.length - 1) {
                    body += `<input type="text" class="blank" data-idx="${index}" data-blank="${i}" autocomplete="off">`;
                }
            });
            body += `</div>`;
            
            // 反馈区
            body += `<div class="feedback" id="fb-${index}"></div>`;
            
            card.innerHTML = html + body;
            area.appendChild(card);
        });
        
        // 滚动到顶部
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function submitBatch() {
        let correctThisBatch = 0;
        
        currentBatch.forEach((item, index) => {
            const inputs = document.querySelectorAll(`input[data-idx="${index}"]`);
            const fb = document.getElementById(`fb-${index}`);
            let isItemCorrect = true;
            let stdAnswers = [];

            inputs.forEach((input, bIdx) => {
                const val = input.value.trim().replace(/\s+/g, '').toLowerCase().replace('^', '');
                
                // 获取对应答案
                // 如果题目有多个空，item.a[bIdx] 是对应答案
                // 如果 item.a 长度小于空数量（例如全是一样的），取最后一个
                let correctOpts = [];
                let displayStr = "";
                
                if (inputs.length > 1) {
                     // 对应填空
                     let ans = item.a[bIdx] || item.a[item.a.length-1]; 
                     correctOpts = [ans];
                     displayStr = ans;
                } else {
                     // 单空，整个数组是备选
                     correctOpts = item.a;
                     displayStr = item.a[0];
                }

                let match = false;
                for (let opt of correctOpts) {
                    let cleanOpt = opt.toLowerCase().replace(/\s+/g, '').replace('^', '');
                    if (val === cleanOpt && val !== "") match = true;
                }

                if (match) {
                    input.classList.add('correct');
                    input.classList.remove('incorrect');
                } else {
                    input.classList.add('incorrect');
                    input.classList.remove('correct');
                    isItemCorrect = false;
                }
                
                if(inputs.length === 1) stdAnswers.push(item.a.join(" / "));
                else stdAnswers.push(displayStr);
            });

            if (isItemCorrect) {
                correctThisBatch++;
                fb.style.display = 'none';
                // 标记为掌握 (只在完全正确时)
                if (!masteredIDs.includes(item.uuid)) {
                    masteredIDs.push(item.uuid);
                }
            } else {
                fb.style.display = 'block';
                fb.innerText = "正确答案: " + stdAnswers.join("  ;  ");
            }
        });

        saveProgress(); // 保存进度

        if (correctThisBatch === currentBatch.length) {
            alert("太棒了！本页全对！自动为您切换下一批新题！");
            loadBatch();
        } else {
            // 自动定位到第一个错误
            let firstErr = document.querySelector('.incorrect');
            if(firstErr) firstErr.scrollIntoView({behavior: "smooth", block: "center"});
        }
    }

    // 辅助：洗牌算法
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
</script>
