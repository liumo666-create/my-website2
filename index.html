<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanyouhao | 数字空间</title>
    <style>
        /* --- 1. 核心变量 --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-sub: #555;
            --accent: #2563eb;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        [data-theme="dark"] {
            --glass-bg: rgba(20, 20, 25, 0.85); /* 暗色模式下稍微不透明一点 */
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --text-sub: #a1a1aa;
            --accent: #60a5fa;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- 2. 全局样式 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            /* 动态渐变背景 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            
            /* 布局核心修复：电脑端居中，手机端自然流动 */
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 2rem;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 3. 容器与卡片 --- */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 电脑端 4 列 */
            gap: 1.2rem;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }

        /* --- 4. 电脑端布局控制 --- */
        .profile { grid-column: span 2; }
        .countdown { grid-column: span 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .toggle { grid-column: span 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; }
        .resources { grid-column: span 2; grid-row: span 2; }
        .memo { grid-column: span 2; }
        .footer { grid-column: span 4; text-align: center; font-size: 0.8rem; color: var(--text-sub); margin-top: 1rem; }

        /* --- 5. 内部元素细节 --- */
        h1 { font-size: 1.5rem; margin: 0 0 0.5rem 0; font-weight: 700; }
        h2 { font-size: 1.1rem; margin: 0 0 1rem 0; display: flex; align-items: center; gap: 8px; }
        p { margin: 0; line-height: 1.6; font-size: 0.95rem; color: var(--text-sub); }
        
        .countdown-num { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1.1; }
        .countdown-label { font-size: 0.85rem; color: var(--text-sub); margin-top: 5px; }

        textarea {
            width: 100%; height: 100px;
            background: rgba(0,0,0,0.05); border: none; border-radius: 10px;
            padding: 12px; resize: none; color: var(--text-main); font-family: inherit;
            box-sizing: border-box; /* 防止撑破边框 */
        }
        textarea:focus { outline: 2px solid var(--accent); background: rgba(0,0,0,0.02); }

        /* 链接样式 */
        .link-item {
            display: flex; justify-content: space-between; align-items: center;
            text-decoration: none; color: var(--text-main);
            padding: 12px; margin-bottom: 8px; border-radius: 10px;
            background: rgba(255,255,255,0.2); border: 1px solid transparent;
        }
        [data-theme="dark"] .link-item { background: rgba(0,0,0,0.2); }
        .link-item:hover { background: var(--accent); color: white; }
        .link-item .tag { font-size: 0.75rem; background: rgba(255,255,255,0.5); padding: 2px 8px; border-radius: 6px; color: #333; }

        /* =========================================
           📱 手机端专属优化 (重点看这里)
           ========================================= */
        @media (max-width: 768px) {
            body {
                display: block; /* 取消强制居中，允许自然滚动 */
                padding: 1rem; /* 减小边距，给内容更多空间 */
                height: auto;
            }

            .container {
                display: flex;
                flex-direction: column; /* 强制变为单列垂直排列 */
                gap: 1rem;
            }

            /* 强制所有卡片占满宽度 */
            .profile, .countdown, .toggle, .resources, .memo, .footer {
                grid-column: auto !important;
                grid-row: auto !important;
                width: 100%; 
                box-sizing: border-box; /* 防止padding撑大宽度 */
            }

            /* 调整手机上的字体大小 */
            h1 { font-size: 1.3rem; }
            .countdown { flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
            .countdown-num { font-size: 1.8rem; }
            .countdown-label { margin-top: 0; }
            
            /* 按钮和倒计时并排显示优化 */
            .toggle { display: none; } /* 手机上为了节省空间，我把单独的切换按钮隐藏了 */
        }
        
        /* 手机上把切换按钮做到右上角悬浮，更节省空间 */
        .mobile-toggle {
            display: none;
            position: fixed; top: 20px; right: 20px;
            background: var(--glass-bg); padding: 10px; border-radius: 50%;
            box-shadow: var(--shadow); z-index: 100; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        @media (max-width: 768px) {
            .mobile-toggle { display: flex; } /* 只在手机显示 */
        }

    </style>
</head>

    <script>
        // 倒计时逻辑
        function updateCountdown() {
            const examDate = new Date(2026, 0, 7); // 1月7日
            const now = new Date();
            const diff = examDate - now;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('days-left').innerText = days > 0 ? days + "天" : "Fighting!";
        }
        updateCountdown();

        // 问候语逻辑
        const hour = new Date().getHours();
        let greet = "你好";
        if (hour < 6) greet = "还没睡？";
        else if (hour < 12) greet = "早上好";
        else if (hour < 18) greet = "下午好";
        else greet = "晚上好";
        document.getElementById('greeting').innerText = greet + "，Fanyouhao";

        // 主题切换逻辑
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // 备忘录逻辑
  
    </script>
