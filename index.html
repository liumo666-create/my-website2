<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanyouhao | Digital Space</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* --- 1. 核心变量与高级质感 --- */
        :root {
            --bg-deep: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6; /* 科技蓝 */
            --accent-glow: rgba(59, 130, 246, 0.5);
            --shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 8rem 1rem; /* 底部留空间给Dock */
        }

        /* --- 2. 动态极光背景 & 噪点 --- */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.2), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.1), transparent 50%);
            animation: gradientMove 20s ease-in-out infinite alternate;
        }
        @keyframes gradientMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        /* 噪点纹理 (增加高级感) */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- 3. Bento Grid 布局 --- */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
            perspective: 1000px; /* 为3D效果做准备 */
        }

        /* 3D 卡片基础 */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            /* 入场动画 */
            opacity: 0; 
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        /* 卡片光效 */
        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg); transition: 0.5s; pointer-events: none;
        }
        .card:hover::before { left: 150%; transition: 0.7s; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 4. 功能模块样式 --- */
        /* 个人信息 */
        .profile { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; color: transparent; }
        .typing-text { color: var(--accent); font-family: monospace; font-size: 0.9rem; min-height: 1.2em;}
        
        /* 倒计时 */
        .countdown { grid-column: span 1; text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .days-num { font-size: 3.5rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px var(--accent-glow); line-height: 1; }
        .days-label { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-sub); margin-top: 10px; }
        
        /* 状态指示 */
        .status-card { grid-column: span 1; display: flex; align-items: center; justify-content: space-between; }
        .status-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 链接列表 */
        .links-card { grid-column: span 2; grid-row: span 2; }
        .link-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; margin-bottom: 10px;
            background: rgba(255,255,255,0.03); border-radius: 12px;
            text-decoration: none; color: var(--text-sub); border: 1px solid transparent; transition: 0.2s;
        }
        .link-item:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: var(--glass-border); transform: translateX(5px); }
        .link-icon { margin-right: 10px; color: var(--accent); }

        /* 留言板 (Valine 定制) */
        .msg-card { grid-column: span 2; min-height: 300px; }
        /* 强行覆盖 Valine 样式以适应暗黑主题 */
        #vcomments .vwrap { border: 1px solid var(--glass-border) !important; background: rgba(0,0,0,0.2); }
        #vcomments .vinput { color: #fff !important; }
        #vcomments .vnick { color: var(--accent) !important; font-weight: bold; }
        #vcomments p { color: #ccc !important; }
        #vcomments .vsys { display: none !important; }
        /* --- 新增：赛博时钟模块 --- */
.clock-card { 
    grid-column: span 1; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    background: rgba(0, 0, 0, 0.3) !important; /* 让时钟背景稍微深一点，突出数字 */
}

.clock-time {
    font-family: 'Courier New', monospace; /* 等宽字体，更有极客感 */
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--accent); /* 核心：霓虹发光效果 */
    display: flex;
    align-items: center;
    gap: 2px;
}

.clock-sec {
    font-size: 1rem;
    color: var(--text-sub);
    margin-top: 8px; /* 秒数稍微小一点，且往下放 */
}

.blink { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.clock-date {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-top: 5px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
        /* --- 5. 底部 Dock 栏 --- */
        .dock-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 15px; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dock-icon {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 12px;
            color: #fff; font-size: 1.2rem; text-decoration: none; transition: 0.3s cubic-bezier(0.3, 0, 0, 1.3);
            position: relative;
        }
        .dock-icon:hover { transform: scale(1.2) translateY(-10px); background: var(--accent); }
        /* 提示文字 */
        .dock-icon::after {
            content: attr(data-title); position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 4px;
            opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .dock-icon:hover::after { opacity: 1; top: -45px; }

        /* --- 6. 移动端适配 --- */
        @media (max-width: 768px) {
            .container { display: flex; flex-direction: column; padding-bottom: 80px; }
            .profile, .countdown, .status-card, .links-card, .msg-card { grid-column: auto; width: 100%; }
            .dock-container { width: 90%; justify-content: space-around; }
            .card:hover { transform: none !important; } /* 手机上去掉3D效果 */
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>

    <div class="container">
        <div class="card profile" data-tilt>
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
                <div style="width:60px; height:60px; background:#333; border-radius:50%; overflow:hidden;">
                    <div style="width:100%; height:100%; background:linear-gradient(45deg, #3b82f6, #8b5cf6);"></div>
                </div>
                <div>
                    <h1>Fanyouhao</h1>
                    <div class="typing-text" id="typing"></div>
                </div>
            </div>
            <p style="font-size: 0.9rem; color: #64748b;">
                <i class="ri-map-pin-line"></i> Library / Lab <br>
                <i class="ri-basketball-line"></i> Mavs Fan (Kai & Luka)
            </p>
        </div>

        <div class="card countdown" data-tilt data-tilt-glare data-tilt-max-glare="0.5">
            <i class="ri-timer-flash-line" style="font-size:1.5rem; color:var(--accent); margin-bottom:10px;"></i>
            <div id="days-left" class="days-num">0</div>
            <div class="days-label">Days to Exam</div>
        </div>

        <div class="card clock-card" data-tilt>
    <div class="clock-time">
        <span id="h">00</span>
        <span class="blink">:</span>
        <span id="m">00</span>
        <span id="s" class="clock-sec">00</span>
    </div>
    <div id="full-date" class="clock-date">LOADING...</div>
</div>

        <div class="card links-card" data-tilt>
            <h2 style="margin-bottom:20px; display:flex; align-items:center; gap:10px;">
                <i class="ri-folder-download-fill"></i> 资源中心
            </h2>
            <a href="https://wwaof.lanzoum.com/iDxHW3f2zuij" target="_blank" class="link-item">
                <span><i class="ri-file-word-line link-icon"></i>数字视频技术复习</span>
                <span style="font-size:0.7rem; background:#fff; color:#000; padding:2px 6px; border-radius:4px;">DOCX</span>
            </a>
            <a href="#" class="link-item">
                <span><i class="ri-file-pdf-line link-icon"></i>通信原理 (Pending)</span>
                <span style="font-size:0.7rem; border:1px solid #666; padding:2px 6px; border-radius:4px;">PDF</span>
            </a>
            <a href="my-projects/game.html" class="link-item">
                <span><i class="ri-gamepad-line link-icon"></i>摸鱼小游戏</span>
                <span style="font-size:0.7rem; border:1px solid #666; padding:2px 6px; border-radius:4px;">HTML</span>
            </a>
        </div>

      <div class="card" style="grid-column: span 4; min-height: 400px;">
    <h2>💬 留言墙 (D1极速版)</h2>
    
    <div id="msg-list" style="height: 300px; overflow-y: auto; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px;">
        <div style="text-align:center; color:#888;">正在连接数据库...</div>
    </div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="nick" placeholder="昵称" style="width: 80px; padding: 8px; border-radius: 5px; border: none;">
        <input type="text" id="msg" placeholder="说点什么..." style="flex: 1; padding: 8px; border-radius: 5px; border: none;">
        <button onclick="send()" id="btn" style="padding: 8px 15px; border-radius: 5px; border: none; background: var(--accent); color: white; cursor: pointer;">发送</button>
    </div>

    <script>
      // 🔴 以前是 workers.dev (会被墙)
// 🟢 现在改成你自己的域名 (稳如老狗)
const API = "https://api.fanyouhao.top";

        async function load() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                document.getElementById('msg-list').innerHTML = data.map(m => 
                    `<div style="margin-bottom:8px; border-bottom:1px dashed #333; padding-bottom:5px;">
                        <strong style="color:var(--accent)">${m.nickname}</strong>: ${m.content}
                    </div>`
                ).join('');
            } catch(e) {
                document.getElementById('msg-list').innerHTML = "加载失败，请检查 Worker 地址";
            }
        }

        async function send() {
            const nick = document.getElementById('nick').value;
            const msg = document.getElementById('msg').value;
            if(!nick || !msg) return alert("都得填！");
            
            document.getElementById('btn').innerText = "...";
            await fetch(API, {
                method: 'POST',
                body: JSON.stringify({ nickname: nick, content: msg })
            });
            document.getElementById('nick').value = '';
            document.getElementById('msg').value = '';
            document.getElementById('btn').innerText = "发送";
            load();
        }
        
        load(); // 页面加载就刷新
    </script>
</div>

    <div class="dock-container">
        <a href="#" class="dock-icon" data-title="Home"><i class="ri-home-4-line"></i></a>
        <a href="https://github.com/liumo666-create" target="_blank" class="dock-icon" data-title="GitHub"><i class="ri-github-fill"></i></a>
        <a href="mailto:your-email@example.com" class="dock-icon" data-title="Email"><i class="ri-mail-send-line"></i></a>
        <div class="dock-icon" data-title="Focus" onclick="toggleFocus()" style="cursor:pointer;"><i class="ri-eye-2-line"></i></div>
    </div>

    <script src='https://unpkg.com/valine/dist/Valine.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // --- 1. 初始化 3D 倾斜特效 ---
        VanillaTilt.init(document.querySelectorAll("[data-tilt]"), {
            max: 10,  // 最大倾斜角度
            speed: 400, // 速度
            glare: true, // 开启反光
            "max-glare": 0.2, // 反光强度
            scale: 1.02 // 悬浮放大
        });

        // --- 2. 打字机效果 ---
        const text = "Electronic Info. Eng. Student | Embedded | Linux";
        let index = 0;
        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typing").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 50); // 打字速度
            }
        }
        window.onload = typeWriter;

        // --- 3. 倒计时逻辑 ---
        const examDate = new Date(2026, 0, 7);
        const diff = examDate - new Date();
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        document.getElementById('days-left').innerText = days > 0 ? days : "NOW";

  
// --- 6. 赛博时钟逻辑 ---
function startClock() {
    const today = new Date();
    
    // 1. 获取时间
    const h = String(today.getHours()).padStart(2, '0');
    const m = String(today.getMinutes()).padStart(2, '0');
    const s = String(today.getSeconds()).padStart(2, '0');
    
    // 2. 更新数字
    document.getElementById('h').innerText = h;
    document.getElementById('m').innerText = m;
    document.getElementById('s').innerText = s;
    
    // 3. 更新日期 (格式：MON 01/05)
    const weeks = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const week = weeks[today.getDay()];
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    
    document.getElementById('full-date').innerText = `${week} ${month}/${day}`;
    
    // 4. 每秒刷新
    setTimeout(startClock, 1000);
}
// 启动时钟
startClock();
        // --- 5. 专注模式 ---
        let isFocus = false;
        function toggleFocus() {
            const cards = document.querySelectorAll('.card');
            isFocus = !isFocus;
            cards.forEach(card => {
                // 如果开启专注，只保留倒计时，隐藏其他
                if(isFocus && !card.classList.contains('countdown')) {
                    card.style.opacity = '0.1';
                    card.style.filter = 'blur(5px)';
                    card.style.pointerEvents = 'none';
                } else {
                    card.style.opacity = '1';
                    card.style.filter = 'none';
                    card.style.pointerEvents = 'auto';
                }
            });
        }
    </script>
</body>
</html>
