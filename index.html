    <style>
        /* --- 1. 核心变量与高级质感 --- */
        :root {
            --bg-deep: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6; /* 科技蓝 */
            --accent-glow: rgba(59, 130, 246, 0.5);
            --shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 8rem 1rem; /* 底部留空间给Dock */
        }

        /* --- 2. 动态极光背景 & 噪点 --- */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.2), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.1), transparent 50%);
            animation: gradientMove 20s ease-in-out infinite alternate;
        }
        @keyframes gradientMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        /* 噪点纹理 (增加高级感) */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- 3. Bento Grid 布局 --- */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
            perspective: 1000px; /* 为3D效果做准备 */
        }

        /* 3D 卡片基础 */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            /* 入场动画 */
            opacity: 0; 
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        /* 卡片光效 */
        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg); transition: 0.5s; pointer-events: none;
        }
        .card:hover::before { left: 150%; transition: 0.7s; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 4. 功能模块样式 --- */
        /* 个人信息 */
        .profile { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; color: transparent; }
        .typing-text { color: var(--accent); font-family: monospace; font-size: 0.9rem; min-height: 1.2em;}
        
        /* 倒计时 */
        .countdown { grid-column: span 1; text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .days-num { font-size: 3.5rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px var(--accent-glow); line-height: 1; }
        .days-label { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-sub); margin-top: 10px; }
        
        /* 状态指示 */
        .status-card { grid-column: span 1; display: flex; align-items: center; justify-content: space-between; }
        .status-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 链接列表 */
        .links-card { grid-column: span 2; grid-row: span 2; }
        .link-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; margin-bottom: 10px;
            background: rgba(255,255,255,0.03); border-radius: 12px;
            text-decoration: none; color: var(--text-sub); border: 1px solid transparent; transition: 0.2s;
        }
        .link-item:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: var(--glass-border); transform: translateX(5px); }
        .link-icon { margin-right: 10px; color: var(--accent); }

        /* 留言板 (Valine 定制) */
        .msg-card { grid-column: span 2; min-height: 300px; }
        /* 强行覆盖 Valine 样式以适应暗黑主题 */
        #vcomments .vwrap { border: 1px solid var(--glass-border) !important; background: rgba(0,0,0,0.2); }
        #vcomments .vinput { color: #fff !important; }
        #vcomments .vnick { color: var(--accent) !important; font-weight: bold; }
        #vcomments p { color: #ccc !important; }
        #vcomments .vsys { display: none !important; }
        /* --- 新增：赛博时钟模块 --- */
.clock-card { 
    grid-column: span 1; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    background: rgba(0, 0, 0, 0.3) !important; /* 让时钟背景稍微深一点，突出数字 */
}

.clock-time {
    font-family: 'Courier New', monospace; /* 等宽字体，更有极客感 */
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--accent); /* 核心：霓虹发光效果 */
    display: flex;
    align-items: center;
    gap: 2px;
}

.clock-sec {
    font-size: 1rem;
    color: var(--text-sub);
    margin-top: 8px; /* 秒数稍微小一点，且往下放 */
}

.blink { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.clock-date {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-top: 5px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
        /* --- 5. 底部 Dock 栏 --- */
        .dock-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 20px;

        .dock-icon {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 12px;
            color: #fff; font-size: 1.2rem; text-decoration: none; transition: 0.3s cubic-bezier(0.3, 0, 0, 1.3);
            position: relative;
        }
        .dock-icon:hover { transform: scale(1.2) translateY(-10px); background: var(--accent); }
        /* 提示文字 */
        .dock-icon::after {
            content: attr(data-title); position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 4px;
            opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .dock-icon:hover::after { opacity: 1; top: -45px; }

        /* --- 6. 移动端适配 --- */
        @media (max-width: 768px) {
            .container { display: flex; flex-direction: column; padding-bottom: 80px; }
            .profile, .countdown, .status-card, .links-card, .msg-card { grid-column: auto; width: 100%; }
            .dock-container { width: 90%; justify-content: space-around; }
            .card:hover { transform: none !important; } /* 手机上去掉3D效果 */
        }
    </style>
</head>

        <script>
            async function getWuhanWeather() {
                // 武汉坐标: 30.58, 114.27
                const url = "https://api.open-meteo.com/v1/forecast?latitude=30.58&longitude=114.27&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FShanghai";

                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    const current = data.current;

                    // 1. 更新数值
                    document.getElementById('temp-val').innerText = Math.round(current.temperature_2m);
                    document.getElementById('wind-val').innerText = current.wind_speed_10m;
                    document.getElementById('humi-val').innerText = current.relative_humidity_2m;

                    // 2. 解析天气代码 (WMO Code) -> 换图标和文字
                    const code = current.weather_code;
                    const iconEl = document.getElementById('weather-icon');
                    const descEl = document.getElementById('weather-desc');
                    
                    // 移除加载动画
                    iconEl.classList.remove('spin');
                    iconEl.classList.remove('ri-loader-4-line');

                    // 简单的代码映射
                    if (code === 0) {
                        iconEl.classList.add('ri-sun-line');
                        descEl.innerText = "Clear Sky 晴";
                    } else if (code >= 1 && code <= 3) {
                        iconEl.classList.add('ri-cloudy-line');
                        descEl.innerText = "Cloudy 多云";
                    } else if (code >= 45 && code <= 48) {
                        iconEl.classList.add('ri-foggy-line');
                        descEl.innerText = "Fog 雾";
                    } else if (code >= 51 && code <= 67) {
                        iconEl.classList.add('ri-drizzle-line');
                        descEl.innerText = "Rain 雨";
                    } else if (code >= 71 && code <= 77) {
                        iconEl.classList.add('ri-snowy-line');
                        descEl.innerText = "Snow 雪";
                    } else if (code >= 95) {
                        iconEl.classList.add('ri-thunderstorms-line');
                        descEl.innerText = "Storm 雷暴";
                    } else {
                        iconEl.classList.add('ri-sun-cloudy-line');
                        descEl.innerText = "Good Day";
                    }

                } catch (e) {
                    console.error("天气加载失败", e);
                    document.getElementById('weather-desc').innerText = "离线";
                }
            }

            // 页面加载后执行
            getWuhanWeather();

     <script>
            const API = "https://api.fanyouhao.top"; 
            let currentParentId = null; // 记录当前正在回复谁

            function formatTime(ts) {
                if(!ts) return '';
                const date = new Date(ts);
                return date.getHours().toString().padStart(2,'0') + ':' + 
                       date.getMinutes().toString().padStart(2,'0');
            }

            // 🟢 核心逻辑：把扁平的留言整理成“树形结构”
            function organizeComments(comments) {
                const map = {};
                const roots = [];
                
                // 1. 初始化所有节点
                comments.forEach(c => {
                    c.children = [];
                    map[c.id] = c;
                });

                // 2. 找爸爸
                comments.forEach(c => {
                    if (c.parent_id && map[c.parent_id]) {
                        // 如果有爸爸，就钻到爸爸的怀里 (children数组)
                        map[c.parent_id].children.push(c);
                        // 按时间正序排子评论 (旧的在上面)
                        map[c.parent_id].children.sort((a,b) => a.id - b.id);
                    } else {
                        // 没有爸爸，就是根评论
                        roots.push(c);
                    }
                });

                // 根评论按时间倒序 (新的在上面)
                return roots.sort((a,b) => b.id - a.id);
            }

                let bubbleClass = 'chat-bubble'; // 默认样式类

                if (isChild) {

                        padding: 6px 10px; 
                        font-size: 0.85rem;
                        width: fit-content; /* 👈 关键：宽度自适应，不占满整行 */
                        max-width: 90%;
                    `;
                } else {
                    // 父留言：保持原样
                    customStyle = 'position:relative;';
                }

                // 递归渲染子留言HTML
                let childrenHtml = '';
                if (msg.children && msg.children.length > 0) {
                    msg.children.forEach(child => {
                        childrenHtml += renderComment(child, true);
                    });
                }

                // 渲染当前卡片
                // 注意：style="${customStyle}" 会覆盖掉 class 里的部分默认样式
                return `
                    <div class="${bubbleClass}" style="${customStyle}">
                        <div class="chat-header" style="margin-bottom:2px;">
                            <span style="color:${isChild ? '#a78bfa' : 'var(--accent)'}; font-weight:bold;">
                                ${isChild ? '↳ ' : ''}${safeNick}
                            </span>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <span class="chat-time" style="font-size:0.7em;">${timeStr}</span>
                                <span onclick="startReply(${msg.id}, '${safeNick}')" style="cursor:pointer; opacity:0.8; font-size:0.9em;" title="回复">↩️</span>
                                <span onclick="deleteMsg(${msg.id}, this)" style="cursor:pointer; opacity:0.6; font-size:0.9em;" title="删除">🗑️</span>
                            </div>
                        </div>
                        <div class="chat-content" style="line-height:1.4;">${safeContent}</div>
                    </div>
                    ${childrenHtml}
                `;
            }

            async function loadMessages() {
                const listDiv = document.getElementById('msg-list');
                try {
                    const res = await fetch(API);
                    const rawData = await res.json();
                    
                    if (rawData.length === 0) {
                        listDiv.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">还没有人说话...</div>';
                        return;
                    }

                    // 整理成树形结构
                    const treeData = organizeComments(rawData);
                    
                    // 渲染 HTML
                    listDiv.innerHTML = treeData.map(root => renderComment(root)).join('');
                    
                } catch (e) {
                    listDiv.innerHTML = '<div style="text-align:center; color:#ef4444;">连接失败</div>';
                }
            }

            // 🟢 点击回复按钮
            function startReply(id, nickname) {
                currentParentId = id;
                const inputArea = document.getElementById('content-input');
                const nickArea = document.getElementById('nick-input');
                
                // 视觉提示
                inputArea.placeholder = `回复 @${nickname} ... (按ESC取消)`;
                inputArea.focus();
                
                // 闪烁一下提醒用户
                inputArea.style.background = "rgba(139, 92, 246, 0.2)";
                setTimeout(() => inputArea.style.background = "", 500);
            }

            // 取消回复状态 (当用户清空输入框或者发完消息后)
            function resetReply() {
                currentParentId = null;
                const inputArea = document.getElementById('content-input');
                inputArea.placeholder = "说点什么...";
            }

            async function submitMsg() {
                const nickInput = document.getElementById('nick-input');
                const contentInput = document.getElementById('content-input');
                const btn = document.getElementById('send-btn');
                const nickname = nickInput.value.trim();
                const content = contentInput.value.trim();

                if (!nickname || !content) {
                    alert("昵称和内容不能为空");
                    return;
                }

                const originalIcon = btn.innerHTML;
                btn.innerHTML = '⏳';
                btn.disabled = true;

                try {
                    await fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            nickname, 
                            content, 
                            parent_id: currentParentId // 🟢 关键：带上父ID
                        })
                    });
                    
                    contentInput.value = '';
                    resetReply(); // 发送成功后重置回复状态
                    await loadMessages();
                } catch (e) {
                    alert("发送失败");
                } finally {
                    btn.innerHTML = originalIcon;
                    btn.disabled = false;
                }
            }
            
            // 之前的删除函数保持不变
            async function deleteMsg(id, btnElement) {
                if (!confirm("⚠️ 确定要删除吗？\n(如果有子回复也会残留显示)")) return;
                const password = prompt("🔐 站长密码：");
                if (!password) return;

                btnElement.innerText = "⏳";
                try {
                    const res = await fetch(API, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id, password: password })
                    });
                    if (res.status === 200) {
                        await loadMessages();
                    } else {
                        alert("❌ 密码错误");
                        btnElement.innerText = "🗑️";
                    }
                } catch (e) { alert("网络错误"); }
            }

            // 监听 ESC 键取消回复
            document.addEventListener('keydown', function(event) {
                if (event.key === "Escape") resetReply();
            });

            loadMessages();
        </script>

// --- 6. 赛博时钟逻辑 ---
function startClock() {
    const today = new Date();
    
    // 1. 获取时间
    const h = String(today.getHours()).padStart(2, '0');
    const m = String(today.getMinutes()).padStart(2, '0');
    const s = String(today.getSeconds()).padStart(2, '0');
    
    // 2. 更新数字
    document.getElementById('h').innerText = h;
    document.getElementById('m').innerText = m;
    document.getElementById('s').innerText = s;
    
    // 3. 更新日期 (格式：MON 01/05)
    const weeks = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const week = weeks[today.getDay()];
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    
    document.getElementById('full-date').innerText = `${week} ${month}/${day}`;
    
    // 4. 每秒刷新
    setTimeout(startClock, 1000);
}

        <style>
            @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
            
            /* 禁止背景滚动，防止用户习惯性往下滑 */
            body.birthday-active { overflow: hidden; }
        </style>

        <script>
            // 页面加载时自动运行
            window.addEventListener('load', function() {
                // 1. 锁住滚动条
                document.body.classList.add('birthday-active');
                
                // 2. 放烟花
                var duration = 5 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2147483648 };

                function randomInRange(min, max) { return Math.random() * (max - min) + min; }

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    var particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            });

            function closeBirthday() {
                // 解锁滚动条
                document.body.classList.remove('birthday-active');
                
                // 点击庆祝烟花
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, zIndex: 2147483648 });

                const overlay = document.getElementById('birthday-overlay');
                overlay.style.animation = "fadeOut 0.8s forwards";
                setTimeout(() => { overlay.style.display = 'none'; }, 800);
            }
        </script>
